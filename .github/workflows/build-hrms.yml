name: build-hrms

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read apps.json
        id: apps
        run: echo "APPS_JSON_BASE64=$(base64 -w 0 apps.json)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/layered/Containerfile
          push: true
          build-args: |
            FRAPPE_BRANCH=version-15
            FRAPPE_IMAGE_PREFIX=frappe
          secrets: |
            apps_json=${{ steps.apps.outputs.APPS_JSON_BASE64 }}
          tags: |
            ghcr.io/skilluence/erpnext-hrms:version-15
